name: Compile Latest Blender iPad App
on:
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Blender Source
        uses: actions/checkout@v4
        with:
          repository: 'blender/blender'
          ref: ios
          lfs: false

      - name: Setup macOS Environment Paths
        run: |
          brew install cmake ninja
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Genertae Core Project Files
        run: |
          mkdir build_ios 
          cd build_ios 
          cmake -G Ninja \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_SYSROOT=iphoneos \
          -DCMAKE_BUILD_TYPE=RELEASE \
          -DWITH_COMPILER_ASAN=OFF \
          ../blender

      - name: Run Native Compilation
        run: |
          cd build_ios 
          /opt/homebrew/bin/ninja
            
      - name: Package Into IPA Payload
        run: | 
          mkdir -p Payload 
          cp -r build_ios/bin/Blender.app Payload/ 2>/dev/null || cp -r build_ios/Blender.app Payload/
          zip -r Blender_Latest.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iPad-Latest-Build
          path: Blender_Latest.ipa
