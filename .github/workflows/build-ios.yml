name: Build Blender iOS IPA

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Blender iOS Source
        uses: actions/checkout@v4
        with:
          ref: ios
          fetch-depth: 1
          lfs: false
          submodules: recursive

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf ~/Library/Android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles
          sudo xcrun simctl delete all 2>/dev/null || true
          df -h

      - name: Install Build Tools
        run: |
          brew install git-lfs cmake ninja
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Initialize Git LFS
        run: |
          git lfs install

      - name: Fetch Blender Dependencies
        run: |
          set -e

          ./build_files/utils/make_update.py --use-ios-libraries

      - name: Inspect iOS Libraries
        run: |
          set -e

          echo "========================================"
          echo "IOS LIBRARY CHECK"
          echo "========================================"

          IOS_ROOT="$PWD/lib/ios_arm64"

          if [ ! -d "$IOS_ROOT" ]; then
            echo "ERROR: lib/ios_arm64 does not exist."
            exit 1
          fi

          echo ""
          echo "Libraries:"
          find "$IOS_ROOT" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -print \
            | sort

          echo ""
          echo "OpenEXR:"
          find "$IOS_ROOT/openexr" \
            -maxdepth 5 \
            -type f \
            -print 2>/dev/null \
            | head -100 || true

          echo ""
          echo "fmt:"
          find "$IOS_ROOT/fmt" \
            -maxdepth 5 \
            -type f \
            -print 2>/dev/null \
            | head -100 || true

      - name: Configure Host Python
        run: |
          set -e

          MACOS_ROOT="$PWD/lib/macos_arm64"
          PYTHON_ROOT="$MACOS_ROOT/python"

          PYTHON_EXECUTABLE="$PYTHON_ROOT/bin/python3.13"
          PYTHON_INCLUDE_DIR="$PYTHON_ROOT/include/python3.13"
          PYTHON_LIBRARY="$PYTHON_ROOT/lib/libpython3.13.a"
          PYTHON_INCLUDE_CONFIG_DIR="$PYTHON_ROOT/lib/python3.13/config-3.13-darwin"

          echo "========================================"
          echo "HOST PYTHON"
          echo "========================================"

          test -x "$PYTHON_EXECUTABLE"
          test -f "$PYTHON_INCLUDE_DIR/Python.h"
          test -f "$PYTHON_LIBRARY"

          echo "Python executable:"
          echo "$PYTHON_EXECUTABLE"

          "$PYTHON_EXECUTABLE" --version

          echo ""
          echo "Python include:"
          echo "$PYTHON_INCLUDE_DIR"

          echo ""
          echo "Python library:"
          echo "$PYTHON_LIBRARY"

          echo ""
          echo "Python config:"
          echo "$PYTHON_INCLUDE_CONFIG_DIR"

      - name: Show Apple Toolchain
        run: |
          set -e

          echo "========================================"
          echo "APPLE TOOLCHAIN"
          echo "========================================"

          xcodebuild -version

          echo ""
          echo "Developer directory:"
          xcode-select -p

          echo ""
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path

          echo ""
          echo "CMake:"
          cmake --version

          echo ""
          echo "Ninja:"
          ninja --version

      - name: Generate Xcode Project
        run: |
          set -e

          IOS_ROOT="$PWD/lib/ios_arm64"
          MACOS_ROOT="$PWD/lib/macos_arm64"
          PYTHON_ROOT="$MACOS_ROOT/python"

          PYTHON_EXECUTABLE="$PYTHON_ROOT/bin/python3.13"
          PYTHON_INCLUDE_DIR="$PYTHON_ROOT/include/python3.13"
          PYTHON_LIBRARY="$PYTHON_ROOT/lib/libpython3.13.a"
          PYTHON_INCLUDE_CONFIG_DIR="$PYTHON_ROOT/lib/python3.13/config-3.13-darwin"

          rm -rf build_ios

          echo "========================================"
          echo "GENERATING XCODE PROJECT"
          echo "========================================"

          cmake \
            -G Xcode \
            -S . \
            -B build_ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$IOS_ROOT" \
            -DCMAKE_FIND_ROOT_PATH="$IOS_ROOT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DPYTHON_VERSION=3.13 \
            -DPYTHON_EXECUTABLE="$PYTHON_EXECUTABLE" \
            -DPYTHON_INCLUDE_DIR="$PYTHON_INCLUDE_DIR" \
            -DPYTHON_LIBRARY="$PYTHON_LIBRARY" \
            -DPYTHON_INCLUDE_CONFIG_DIR="$PYTHON_INCLUDE_CONFIG_DIR"

      - name: List Xcode Targets
        run: |
          set -e

          echo "========================================"
          echo "XCODE TARGETS"
          echo "========================================"

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -list

      - name: Build Cross Compilation Tools
        run: |
          set -e

          echo "========================================"
          echo "BUILDING CROSS COMPILATION TOOLS"
          echo "========================================"

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -target blender_cross_tools_compile \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee cross_tools_build.log

      - name: Build Blender iOS App
        run: |
          set -e

          echo "========================================"
          echo "BUILDING BLENDER FOR IOS"
          echo "========================================"

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            | tee ios_build.log

      - name: Locate Blender.app
        run: |
          echo "========================================"
          echo "SEARCHING FOR BLENDER.APP"
          echo "========================================"

          find build_ios \
            -type d \
            -name "Blender.app" \
            -print

      - name: Package Unsigned IPA
        run: |
          set -e

          APP="build_ios/bin/Release/Blender.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Blender.app was not produced."

            echo ""
            echo "Searching for any .app:"
            find build_ios \
              -type d \
              -name "*.app" \
              -print

            exit 1
          fi

          echo "Found Blender.app:"
          echo "$APP"

          echo ""
          echo "App size:"
          du -sh "$APP"

          rm -rf IPA
          mkdir -p IPA/Payload

          cp -R "$APP" IPA/Payload/Blender.app

          cd IPA

          /usr/bin/zip \
            -r \
            ../Blender-iPad-unsigned.ipa \
            Payload/

          cd ..

          echo ""
          echo "IPA:"
          ls -lh Blender-iPad-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: Blender-iPad-unsigned.ipa
          retention-days: 30

      - name: Upload Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blender-ios-build-diagnostics
          path: |
            cross_tools_build.log
            ios_build.log
            build_ios/**/*.log
            build_ios/**/*.txt
          retention-days: 7
