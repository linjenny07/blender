name: Compile Latest Blender iPad App

on:
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout Blender Source
        uses: actions/checkout@v4
        with:
          repository: linjenny07/blender
          ref: ios
          submodules: recursive
          lfs: false

      - name: Install Build Tools
        run: |
          brew install cmake ninja
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Fetch Blender Libraries
        run: |
          git lfs install --local
          ./build_files/utils/make_update.py --no-libraries

      - name: Fetch iOS Libraries
        run: |
          rm -rf lib/ios_arm64
          git clone https://projects.blender.org/blender/lib-ios_arm64.git lib/ios_arm64
          cd lib/ios_arm64
          git checkout 393201c7c8525941553f6a96e19b909d6b3bfc4f

      - name: Fetch macOS ARM64 Libraries
        run: |
          rm -rf lib/macos_arm64
          git clone https://projects.blender.org/blender/lib-macos_arm64.git lib/macos_arm64
          cd lib/macos_arm64
          git checkout a241b11
          git lfs install
          git lfs pull

      - name: Inspect OpenEXR
        run: |
          echo "========================================"
          echo "OPENEXR DIAGNOSTIC"
          echo "========================================"

          OPENEXR_ROOT="$PWD/lib/ios_arm64/openexr"

          echo ""
          echo "OpenEXR root:"
          echo "$OPENEXR_ROOT"

          echo ""
          echo "OpenEXR directories:"
          find "$OPENEXR_ROOT" -type d -maxdepth 5 | sort

          echo ""
          echo "OpenEXR CMake/config files:"
          find "$OPENEXR_ROOT" -type f \
            \( \
              -name "*.cmake" \
              -o -name "*.cps" \
              -o -name "*Config.cmake" \
              -o -name "*config.cmake" \
            \) \
            -print | sort

          echo ""
          echo "OpenEXR libraries:"
          find "$OPENEXR_ROOT" -type f \
            \( \
              -name "*.a" \
              -o -name "*.dylib" \
            \) \
            -print | sort

          echo ""
          echo "OpenEXR headers:"
          find "$OPENEXR_ROOT/include" \
            -type f \
            -name "*.h" \
            -maxdepth 3 \
            -print | head -50

      - name: Inspect fmt
        run: |
          echo "========================================"
          echo "FMT DIAGNOSTIC"
          echo "========================================"

          FMT_ROOT="$PWD/lib/ios_arm64/fmt"

          if [ -d "$FMT_ROOT" ]; then
            echo "fmt directory exists:"
            find "$FMT_ROOT" -maxdepth 5 -type f -print | head -100
          else
            echo "fmt directory does not exist"
          fi

      - name: Show Apple Toolchain
        run: |
          echo "========================================"
          echo "APPLE TOOLCHAIN"
          echo "========================================"

          xcodebuild -version
          echo ""
          xcrun --sdk iphoneos --show-sdk-path
          echo ""
          cmake --version
          echo ""
          ninja --version

      - name: Configure iOS Build
        run: |
          set -e

          IOS_ROOT="$PWD/lib/ios_arm64"
          MACOS_ROOT="$PWD/lib/macos_arm64"

          PYTHON_ROOT="$MACOS_ROOT/python"
          FREETYPE_ROOT="$IOS_ROOT/freetype"
          OPENEXR_ROOT="$IOS_ROOT/openexr"
          PNG_ROOT="$IOS_ROOT/png"
          JPEG_ROOT="$IOS_ROOT/jpeg"
          TIFF_ROOT="$IOS_ROOT/tiff"

          PYTHON_EXECUTABLE="$PYTHON_ROOT/bin/python3.13"
          PYTHON_INCLUDE_DIR="$PYTHON_ROOT/include/python3.13"
          PYTHON_LIBRARY="$PYTHON_ROOT/lib/libpython3.13.a"
          PYTHON_INCLUDE_CONFIG_DIR="$PYTHON_ROOT/lib/python3.13/config-3.13-darwin"

          FREETYPE_INCLUDE_DIR="$FREETYPE_ROOT/include/freetype2"
          FREETYPE_LIBRARY="$FREETYPE_ROOT/lib/libfreetype.a"

          PNG_INCLUDE_DIR="$PNG_ROOT/include"
          PNG_LIBRARY="$PNG_ROOT/lib/libpng16.a"

          JPEG_INCLUDE_DIR="$JPEG_ROOT/include"
          JPEG_LIBRARY="$JPEG_ROOT/lib/libjpeg.a"

          TIFF_INCLUDE_DIR="$TIFF_ROOT/include"
          TIFF_LIBRARY="$TIFF_ROOT/lib/libtiff.a"

          echo "========================================"
          echo "BUILD CONFIGURATION"
          echo "========================================"

          echo ""
          echo "iOS library root:"
          echo "$IOS_ROOT"

          echo ""
          echo "Python:"
          echo "$PYTHON_EXECUTABLE"
          echo "$PYTHON_INCLUDE_DIR"
          echo "$PYTHON_LIBRARY"

          echo ""
          echo "FreeType:"
          echo "$FREETYPE_INCLUDE_DIR"
          echo "$FREETYPE_LIBRARY"

          echo ""
          echo "OpenEXR:"
          echo "$OPENEXR_ROOT"

          echo ""
          echo "PNG:"
          echo "$PNG_INCLUDE_DIR"
          echo "$PNG_LIBRARY"

          echo ""
          echo "JPEG:"
          echo "$JPEG_INCLUDE_DIR"
          echo "$JPEG_LIBRARY"

          echo ""
          echo "TIFF:"
          echo "$TIFF_INCLUDE_DIR"
          echo "$TIFF_LIBRARY"

          echo ""
          echo "========================================"
          echo "CHECKING REQUIRED FILES"
          echo "========================================"

          test -x "$PYTHON_EXECUTABLE"
          test -f "$PYTHON_INCLUDE_DIR/Python.h"
          test -f "$PYTHON_LIBRARY"

          test -f "$FREETYPE_INCLUDE_DIR/ft2build.h"
          test -f "$FREETYPE_LIBRARY"

          test -d "$OPENEXR_ROOT"
          test -d "$OPENEXR_ROOT/include"
          test -d "$OPENEXR_ROOT/lib"

          test -f "$PNG_INCLUDE_DIR/png.h"
          test -f "$PNG_LIBRARY"

          test -f "$JPEG_INCLUDE_DIR/jpeglib.h"
          test -f "$JPEG_LIBRARY"

          test -f "$TIFF_INCLUDE_DIR/tiff.h"
          test -f "$TIFF_LIBRARY"

          echo ""
          echo "All basic dependency files exist."

          "$PYTHON_EXECUTABLE" --version

          rm -rf build_ios

          echo ""
          echo "========================================"
          echo "RUNNING CMAKE"
          echo "========================================"

          cmake -S . -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$IOS_ROOT" \
            -DCMAKE_FIND_ROOT_PATH="$IOS_ROOT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DPYTHON_VERSION=3.13 \
            -DPYTHON_EXECUTABLE="$PYTHON_EXECUTABLE" \
            -DPYTHON_INCLUDE_DIR="$PYTHON_INCLUDE_DIR" \
            -DPYTHON_LIBRARY="$PYTHON_LIBRARY" \
            -DPYTHON_INCLUDE_CONFIG_DIR="$PYTHON_INCLUDE_CONFIG_DIR" \
            -DFREETYPE_INCLUDE_DIRS="$FREETYPE_INCLUDE_DIR" \
            -DFREETYPE_LIBRARY="$FREETYPE_LIBRARY" \
            -DPNG_PNG_INCLUDE_DIR="$PNG_INCLUDE_DIR" \
            -DPNG_LIBRARY="$PNG_LIBRARY" \
            -DJPEG_INCLUDE_DIR="$JPEG_INCLUDE_DIR" \
            -DJPEG_LIBRARY="$JPEG_LIBRARY" \
            -DTIFF_INCLUDE_DIR="$TIFF_INCLUDE_DIR" \
            -DTIFF_LIBRARY="$TIFF_LIBRARY"

      - name: Build Blender
        run: |
          set -e

          echo "========================================"
          echo "BUILDING BLENDER"
          echo "========================================"

          cmake --build build_ios \
            --config Release \
            --parallel "$(sysctl -n hw.ncpu)"

      - name: Find Blender App
        run: |
          echo "========================================"
          echo "SEARCHING FOR BLENDER.APP"
          echo "========================================"

          find build_ios \
            -type d \
            -name "Blender.app" \
            -print

      - name: Package Unsigned IPA
        run: |
          set -e

          APP="$(find build_ios -type d -name "Blender.app" -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app was not produced."
            exit 1
          fi

          echo "Found Blender.app:"
          echo "$APP"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/Blender.app

          /usr/bin/ditto \
            -c -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            Blender-iPad-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iPad-unsigned
          path: Blender-iPad-unsigned.ipa
