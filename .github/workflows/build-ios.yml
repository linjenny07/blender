name: Build Blender iPad

on:
  workflow_dispatch:
  push:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout iOS branch 
        uses: actions/checkout@v4 
        env: 
          GIT_LFS_SKIP_SMUDGE: "1" 
        with: 
          repository: linjenny07/blender 
          ref: ios 
          submodules: recursive 
          lfs: false 
        
      - name: Fetch Blender LFS data 
        run: | 
          git lfs install --local 
          ./build_files/utils/make_update.py --no-libraries
          
      - name: Fetch iOS libraries
        run: |
          rm -rf lib/ios_arm64
          git clone https://projects.blender.org/blender/lib-ios_arm64.git lib/ios_arm64
          cd lib/ios_arm64
          git checkout 393201c7c8525941553f6a96e19b909d6b3bfc4f

      - name: Fetch macOS ARM64 libraries
        run: |
          rm -rf lib/macos_arm64
          git clone https://projects.blender.org/blender/lib-macos_arm64.git lib/macos_arm64
          cd lib/macos_arm64
          git checkout a241b11
          git lfs install
          git lfs pull

      - name: Inspect macOS Python
        run: |
          echo "========================================"
          echo "MACOS PYTHON DIAGNOSTIC"
          echo "========================================"

          echo ""
          echo "=== Python directory ==="
          ls -la lib/macos_arm64/python || true

          echo ""
          echo "=== Python bin ==="
          ls -la lib/macos_arm64/python/bin || true

          echo ""
          echo "=== Python include directories ==="
          find lib/macos_arm64/python -type d -name "include" -print || true

          echo ""
          echo "=== Python.h ==="
          find lib/macos_arm64/python -name "Python.h" -print || true

          echo ""
          echo "=== Python libraries ==="
          find lib/macos_arm64/python \
            \( -name "libpython*" -o -name "Python.framework" \) \
            -print || true

          echo ""
          echo "=== Python 3.13 files ==="
          find lib/macos_arm64/python -maxdepth 6 \
            \( -name "python3.13" \
            -o -name "Python.h" \
            -o -name "libpython3.13*" \) \
            -print || true

          echo ""
          echo "=== Python executable information ==="
          if [ -f "lib/macos_arm64/python/bin/python3.13" ]; then
            file lib/macos_arm64/python/bin/python3.13
            lib/macos_arm64/python/bin/python3.13 --version
          else
            echo "python3.13 executable NOT FOUND"
          fi

      - name: Install build tools
        run: |
          brew install cmake ninja

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          cmake --version
          ninja --version

      - name: Verify library layout
        run: |
          echo "=== lib directory ==="
          ls -la lib

          echo ""
          echo "=== iOS library directory ==="
          ls -la lib/ios_arm64 | head -100

          echo ""
          echo "=== macOS library directory ==="
          ls -la lib/macos_arm64 | head -100

      - name: Configure iOS build
        run: |
          PYTHON_ROOT="$PWD/lib/macos_arm64/python"

          PYTHON_EXECUTABLE="$PYTHON_ROOT/bin/python3.13"
          PYTHON_INCLUDE_DIR="$PYTHON_ROOT/include/python3.13"
          PYTHON_LIBRARY="$PYTHON_ROOT/lib/libpython3.13.a"
          PYTHON_INCLUDE_CONFIG_DIR="$PYTHON_ROOT/lib/python3.13/config-3.13-darwin"

          echo "=== Python configuration ==="
          echo "Executable: $PYTHON_EXECUTABLE"
          echo "Include:    $PYTHON_INCLUDE_DIR"
          echo "Library:    $PYTHON_LIBRARY"
          echo "Config:     $PYTHON_INCLUDE_CONFIG_DIR"

          test -f "$PYTHON_EXECUTABLE"
          test -f "$PYTHON_INCLUDE_DIR/Python.h"
          test -f "$PYTHON_LIBRARY"
          test -d "$PYTHON_INCLUDE_CONFIG_DIR"

          "$PYTHON_EXECUTABLE" --version

          cmake -S . -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPYTHON_VERSION=3.13 \
            -DPYTHON_EXECUTABLE="$PYTHON_EXECUTABLE" \
            -DPYTHON_INCLUDE_DIR="$PYTHON_INCLUDE_DIR" \
            -DPYTHON_LIBRARY="$PYTHON_LIBRARY" \
            -DPYTHON_INCLUDE_CONFIG_DIR="$PYTHON_INCLUDE_CONFIG_DIR""

      - name: Build Blender
        run: |
          rm -rf build_ios
          cmake --build build_ios \
            --config Release \
            --parallel $(sysctl -n hw.ncpu)

      - name: Find Blender.app
        run: |
          echo "Searching for Blender.app..."
          find build_ios -type d -name "Blender.app" -print

      - name: Package unsigned IPA
        run: |
          APP="$(find build_ios -type d -name "Blender.app" -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app was not produced."
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/Blender.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Blender-iPad-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iPad-unsigned
          path: Blender-iPad-unsigned.ipa
