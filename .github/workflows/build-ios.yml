name: Build Blender iPad

on:
  workflow_dispatch:
  push:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout iOS branch
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        with:
          repository: linjenny07/blender
          ref: ios
          submodules: recursive
          lfs: false

      - name: Fetch Blender LFS data
        run: |
          git lfs install --local
          ./build_files/utils/make_update.py --no-libraries

      - name: Fetch iOS libraries
        run: |
          rm -rf lib/ios_arm64
          git clone https://projects.blender.org/blender/lib-ios_arm64.git lib/ios_arm64
          cd lib/ios_arm64
          git checkout 393201c7c8525941553f6a96e19b909d6b3bfc4f

      - name: Fetch macOS ARM64 libraries
        run: |
          rm -rf lib/macos_arm64
          git clone https://projects.blender.org/blender/lib-macos_arm64.git lib/macos_arm64
          cd lib/macos_arm64
          git checkout a241b11
          git lfs install
          git lfs pull

      - name: Install build tools
        run: |
          brew install cmake ninja

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          cmake --version
          ninja --version

      - name: Inspect required iOS libraries
        run: |
          echo "========================================"
          echo "CHECKING iOS LIBRARIES"
          echo "========================================"

          echo ""
          echo "=== PNG ==="
          ls -la lib/ios_arm64/png/include
          ls -la lib/ios_arm64/png/lib

          echo ""
          echo "=== JPEG ==="
          ls -la lib/ios_arm64/jpeg/include 2>/dev/null || true
          ls -la lib/ios_arm64/jpeg/lib 2>/dev/null || true

          echo ""
          echo "=== OpenEXR ==="
          ls -la lib/ios_arm64/openexr/include/OpenEXR 2>/dev/null | head -30 || true
          ls -la lib/ios_arm64/openexr/lib 2>/dev/null || true

          echo ""
          echo "=== FreeType ==="
          ls -la lib/ios_arm64/freetype/include/freetype2
          ls -la lib/ios_arm64/freetype/lib

      - name: Locate iOS library files
        run: |
          echo "========================================"
          echo "LIBRARY FILE SEARCH"
          echo "========================================"

          echo ""
          echo "=== JPEG files ==="
          find "$PWD/lib/ios_arm64" -type f \
            \( -name "jpeglib.h" -o -name "libjpeg.a" -o -name "libjpeg.dylib" \) \
            -print || true

          echo ""
          echo "=== PNG files ==="
          find "$PWD/lib/ios_arm64" -type f \
            \( -name "png.h" -o -name "libpng.a" -o -name "libpng16.a" \) \
            -print || true

          echo ""
          echo "=== OpenEXR CMake/package files ==="
          find "$PWD/lib/ios_arm64/openexr" -type f \
            \( -name "*.cmake" \
            -o -name "*.cps" \
            -o -name "*Config.cmake" \
            -o -name "*config.cmake" \) \
            -print || true

          echo ""
          echo "=== OpenEXR libraries ==="
          find "$PWD/lib/ios_arm64/openexr" -type f \
            \( -name "*.a" -o -name "*.dylib" \) \
            -print || true

      - name: Inspect macOS Python
        run: |
          echo "========================================"
          echo "MACOS PYTHON DIAGNOSTIC"
          echo "========================================"

          echo ""
          echo "=== Python directory ==="
          ls -la lib/macos_arm64/python || true

          echo ""
          echo "=== Python bin ==="
          ls -la lib/macos_arm64/python/bin || true

          echo ""
          echo "=== Python include directories ==="
          find lib/macos_arm64/python -type d -name "include" -print || true

          echo ""
          echo "=== Python.h ==="
          find lib/macos_arm64/python -name "Python.h" -print || true

          echo ""
          echo "=== Python libraries ==="
          find lib/macos_arm64/python \
            \( -name "libpython*" -o -name "Python.framework" \) \
            -print || true

          echo ""
          echo "=== Python 3.13 files ==="
          find lib/macos_arm64/python -maxdepth 6 \
            \( -name "python3.13" \
            -o -name "Python.h" \
            -o -name "libpython3.13*" \) \
            -print || true

          echo ""
          echo "=== Python executable information ==="
          if [ -f "lib/macos_arm64/python/bin/python3.13" ]; then
            file lib/macos_arm64/python/bin/python3.13
            lib/macos_arm64/python/bin/python3.13 --version
          else
            echo "python3.13 executable NOT FOUND"
          fi

      - name: Configure iOS build
        run: |
          PYTHON_ROOT="$PWD/lib/macos_arm64/python"

          PYTHON_EXECUTABLE="$PYTHON_ROOT/bin/python3.13"
          PYTHON_INCLUDE_DIR="$PYTHON_ROOT/include/python3.13"
          PYTHON_LIBRARY="$PYTHON_ROOT/lib/libpython3.13.a"
          PYTHON_INCLUDE_CONFIG_DIR="$PYTHON_ROOT/lib/python3.13/config-3.13-darwin"

          FREETYPE_ROOT="$PWD/lib/ios_arm64/freetype"
          FREETYPE_INCLUDE_DIR="$FREETYPE_ROOT/include/freetype2"
          FREETYPE_LIBRARY="$FREETYPE_ROOT/lib/libfreetype.a"

          PNG_ROOT="$PWD/lib/ios_arm64/png"
          PNG_INCLUDE_DIR="$PNG_ROOT/include"
          PNG_LIBRARY="$PNG_ROOT/lib/libpng16.a"

          JPEG_ROOT="$PWD/lib/ios_arm64/jpeg"
          JPEG_INCLUDE_DIR="$JPEG_ROOT/include"
          JPEG_LIBRARY="$JPEG_ROOT/lib/libjpeg.a"

          OPENEXR_ROOT="$PWD/lib/ios_arm64/openexr"
          OPENEXR_INCLUDE_DIR="$OPENEXR_ROOT/include"
          OPENEXR_LIBRARY_DIR="$OPENEXR_ROOT/lib"

          echo "========================================"
          echo "BUILD CONFIGURATION"
          echo "========================================"

          echo ""
          echo "=== Python ==="
          echo "$PYTHON_EXECUTABLE"
          echo "$PYTHON_INCLUDE_DIR"
          echo "$PYTHON_LIBRARY"

          echo ""
          echo "=== FreeType ==="
          echo "$FREETYPE_INCLUDE_DIR"
          echo "$FREETYPE_LIBRARY"

          echo ""
          echo "=== PNG ==="
          echo "$PNG_INCLUDE_DIR"
          echo "$PNG_LIBRARY"

          echo ""
          echo "=== JPEG ==="
          echo "$JPEG_INCLUDE_DIR"
          echo "$JPEG_LIBRARY"

          echo ""
          echo "=== OpenEXR ==="
          echo "$OPENEXR_ROOT"

          echo ""
          echo "========================================"
          echo "VERIFYING FILES"
          echo "========================================"

          test -f "$PYTHON_EXECUTABLE"
          test -f "$PYTHON_INCLUDE_DIR/Python.h"
          test -f "$PYTHON_LIBRARY"

          test -f "$FREETYPE_INCLUDE_DIR/ft2build.h"
          test -f "$FREETYPE_LIBRARY"

          test -f "$PNG_INCLUDE_DIR/png.h"
          test -f "$PNG_LIBRARY"

          test -f "$JPEG_INCLUDE_DIR/jpeglib.h"
          test -f "$JPEG_LIBRARY"

          "$PYTHON_EXECUTABLE" --version

          rm -rf build_ios

          cmake -S . -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/lib/ios_arm64" \
            -DPYTHON_VERSION=3.13 \
            -DPYTHON_EXECUTABLE="$PYTHON_EXECUTABLE" \
            -DPYTHON_INCLUDE_DIR="$PYTHON_INCLUDE_DIR" \
            -DPYTHON_LIBRARY="$PYTHON_LIBRARY" \
            -DPYTHON_INCLUDE_CONFIG_DIR="$PYTHON_INCLUDE_CONFIG_DIR" \
            -DFREETYPE_INCLUDE_DIRS="$FREETYPE_INCLUDE_DIR" \
            -DFREETYPE_LIBRARY="$FREETYPE_LIBRARY" \
            -DPNG_PNG_INCLUDE_DIR="$PNG_INCLUDE_DIR" \
            -DPNG_LIBRARY="$PNG_LIBRARY" \
            -DJPEG_INCLUDE_DIR="$JPEG_INCLUDE_DIR" \
            -DJPEG_LIBRARY="$JPEG_LIBRARY" \
            -DOPENEXR_ROOT="$OPENEXR_ROOT" \
            -DCMAKE_LIBRARY_PATH="$PWD/lib/ios_arm64/png/lib;$PWD/lib/ios_arm64/jpeg/lib;$PWD/lib/ios_arm64/openexr/lib" \
            -DCMAKE_INCLUDE_PATH="$PWD/lib/ios_arm64/png/include;$PWD/lib/ios_arm64/jpeg/include;$PWD/lib/ios_arm64/openexr/include"

      - name: Show CMake cache
        if: always()
        run: |
          echo "========================================"
          echo "CMAKE CACHE"
          echo "========================================"

          if [ -f build_ios/CMakeCache.txt ]; then
            grep -E \
              "PNG_|JPEG_|OPENEXR|FREETYPE|PYTHON" \
              build_ios/CMakeCache.txt || true
          else
            echo "CMakeCache.txt does not exist."
          fi

      - name: Build Blender
        run: |
          cmake --build build_ios \
            --config Release \
            --parallel $(sysctl -n hw.ncpu)

      - name: Find Blender.app
        run: |
          echo "Searching for Blender.app..."
          find build_ios -type d -name "Blender.app" -print

      - name: Package unsigned IPA
        run: |
          APP="$(find build_ios -type d -name "Blender.app" -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app was not produced."
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/Blender.app

          /usr/bin/ditto \
            -c -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            Blender-iPad-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iPad-unsigned
          path: Blender-iPad-unsigned.ipa
