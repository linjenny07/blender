name: Compile Latest Blender iPad App

on:
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout Blender Source
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        with:
          repository: linjenny07/blender
          ref: ios
          submodules: recursive
          lfs: false

      - name: Install Build Tools
        run: |
          brew install cmake ninja

      - name: Fetch Blender Libraries
        run: |
          git lfs install --local
          ./build_files/utils/make_update.py --no-libraries

      - name: Fetch iOS Libraries
        run: |
          rm -rf lib/ios_arm64
          git clone https://projects.blender.org/blender/lib-ios_arm64.git lib/ios_arm64
          cd lib/ios_arm64
          git checkout 393201c7c8525941553f6a96e19b909d6b3bfc4f

      - name: Fetch macOS ARM64 Libraries
        run: |
          rm -rf lib/macos_arm64
          git clone https://projects.blender.org/blender/lib-macos_arm64.git lib/macos_arm64
          cd lib/macos_arm64
          git checkout a241b11
          git lfs install
          git lfs pull

      - name: Show Apple Toolchain
        run: |
          echo "=== Xcode ==="
          xcodebuild -version

          echo ""
          echo "=== iOS SDK ==="
          xcrun --sdk iphoneos --show-sdk-path

          echo ""
          echo "=== CMake ==="
          cmake --version

          echo ""
          echo "=== Ninja ==="
          ninja --version

      - name: Verify Dependencies
        run: |
          echo "========================================"
          echo "VERIFYING DEPENDENCIES"
          echo "========================================"

          PYTHON_ROOT="$PWD/lib/macos_arm64/python"

          PYTHON_EXECUTABLE="$PYTHON_ROOT/bin/python3.13"
          PYTHON_INCLUDE_DIR="$PYTHON_ROOT/include/python3.13"
          PYTHON_LIBRARY="$PYTHON_ROOT/lib/libpython3.13.a"

          FREETYPE_ROOT="$PWD/lib/ios_arm64/freetype"
          FREETYPE_INCLUDE_DIR="$FREETYPE_ROOT/include/freetype2"
          FREETYPE_LIBRARY="$FREETYPE_ROOT/lib/libfreetype.a"

          OPENEXR_ROOT="$PWD/lib/ios_arm64/openexr"
          OPENEXR_DIR="$OPENEXR_ROOT/lib/cmake/OpenEXR"

          PNG_ROOT="$PWD/lib/ios_arm64/png"
          PNG_INCLUDE_DIR="$PNG_ROOT/include"
          PNG_LIBRARY="$PNG_ROOT/lib/libpng16.a"

          JPEG_ROOT="$PWD/lib/ios_arm64/jpeg"
          JPEG_INCLUDE_DIR="$JPEG_ROOT/include"
          JPEG_LIBRARY="$JPEG_ROOT/lib/libjpeg.a"

          TIFF_ROOT="$PWD/lib/ios_arm64/tiff"
          TIFF_INCLUDE_DIR="$TIFF_ROOT/include"
          TIFF_LIBRARY="$TIFF_ROOT/lib/libtiff.a"

          echo ""
          echo "=== Checking Python executable ==="
          if [ -f "$PYTHON_EXECUTABLE" ]; then
            echo "OK: $PYTHON_EXECUTABLE"
          else
            echo "ERROR: Python executable missing"
            exit 1
          fi

          echo ""
          echo "=== Checking Python headers ==="
          if [ -f "$PYTHON_INCLUDE_DIR/Python.h" ]; then
            echo "OK: $PYTHON_INCLUDE_DIR/Python.h"
          else
            echo "ERROR: Python.h missing"
            exit 1
          fi

          echo ""
          echo "=== Checking Python library ==="
          if [ -f "$PYTHON_LIBRARY" ]; then
            echo "OK: $PYTHON_LIBRARY"
          else
            echo "ERROR: libpython3.13.a missing"
            exit 1
          fi

          echo ""
          echo "=== Checking FreeType ==="
          if [ -f "$FREETYPE_INCLUDE_DIR/ft2build.h" ]; then
            echo "OK: FreeType headers"
          else
            echo "ERROR: FreeType headers missing"
            exit 1
          fi

          if [ -f "$FREETYPE_LIBRARY" ]; then
            echo "OK: FreeType library"
          else
            echo "ERROR: FreeType library missing"
            exit 1
          fi

          echo ""
          echo "=== Checking OpenEXR ==="
          if [ -d "$OPENEXR_DIR" ]; then
            echo "OK: OpenEXR CMake directory exists"
            ls -la "$OPENEXR_DIR"
          else
            echo "ERROR: OpenEXR CMake directory missing"
            find "$OPENEXR_ROOT" -maxdepth 8 -type f -print
            exit 1
          fi

          echo ""
          echo "=== Checking PNG ==="
          if [ -f "$PNG_LIBRARY" ]; then
            echo "OK: $PNG_LIBRARY"
          else
            echo "ERROR: PNG library missing"
            exit 1
          fi

          echo ""
          echo "=== Checking JPEG ==="
          if [ -f "$JPEG_LIBRARY" ]; then
            echo "OK: $JPEG_LIBRARY"
          else
            echo "ERROR: JPEG library missing"
            exit 1
          fi

          echo ""
          echo "=== Checking TIFF ==="
          if [ -f "$TIFF_LIBRARY" ]; then
            echo "OK: $TIFF_LIBRARY"
          else
            echo "ERROR: TIFF library missing"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "ALL REQUIRED CHECKS PASSED"
          echo "========================================"

      - name: Configure iOS Build
        run: |
          set -o pipefail

          PYTHON_ROOT="$PWD/lib/macos_arm64/python"

          PYTHON_EXECUTABLE="$PYTHON_ROOT/bin/python3.13"
          PYTHON_INCLUDE_DIR="$PYTHON_ROOT/include/python3.13"
          PYTHON_LIBRARY="$PYTHON_ROOT/lib/libpython3.13.a"
          PYTHON_INCLUDE_CONFIG_DIR="$PYTHON_ROOT/lib/python3.13/config-3.13-darwin"

          FREETYPE_ROOT="$PWD/lib/ios_arm64/freetype"
          FREETYPE_INCLUDE_DIR="$FREETYPE_ROOT/include/freetype2"
          FREETYPE_LIBRARY="$FREETYPE_ROOT/lib/libfreetype.a"

          OPENEXR_ROOT="$PWD/lib/ios_arm64/openexr"
          OPENEXR_DIR="$OPENEXR_ROOT/lib/cmake/OpenEXR"

          PNG_ROOT="$PWD/lib/ios_arm64/png"
          PNG_INCLUDE_DIR="$PNG_ROOT/include"
          PNG_LIBRARY="$PNG_ROOT/lib/libpng16.a"

          JPEG_ROOT="$PWD/lib/ios_arm64/jpeg"
          JPEG_INCLUDE_DIR="$JPEG_ROOT/include"
          JPEG_LIBRARY="$JPEG_ROOT/lib/libjpeg.a"

          TIFF_ROOT="$PWD/lib/ios_arm64/tiff"
          TIFF_INCLUDE_DIR="$TIFF_ROOT/include"
          TIFF_LIBRARY="$TIFF_ROOT/lib/libtiff.a"

          echo "========================================"
          echo "CONFIGURING BLENDER FOR iOS"
          echo "========================================"

          rm -rf build_ios

          cmake -S . -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/lib/ios_arm64;$OPENEXR_ROOT" \
            -DOpenEXR_DIR="$OPENEXR_DIR" \
            -DPYTHON_VERSION=3.13 \
            -DPYTHON_EXECUTABLE="$PYTHON_EXECUTABLE" \
            -DPYTHON_INCLUDE_DIR="$PYTHON_INCLUDE_DIR" \
            -DPYTHON_LIBRARY="$PYTHON_LIBRARY" \
            -DPYTHON_INCLUDE_CONFIG_DIR="$PYTHON_INCLUDE_CONFIG_DIR" \
            -DFREETYPE_INCLUDE_DIRS="$FREETYPE_INCLUDE_DIR" \
            -DFREETYPE_LIBRARY="$FREETYPE_LIBRARY" \
            -DPNG_PNG_INCLUDE_DIR="$PNG_INCLUDE_DIR" \
            -DPNG_LIBRARY="$PNG_LIBRARY" \
            -DJPEG_INCLUDE_DIR="$JPEG_INCLUDE_DIR" \
            -DJPEG_LIBRARY="$JPEG_LIBRARY" \
            -DTIFF_INCLUDE_DIR="$TIFF_INCLUDE_DIR" \
            -DTIFF_LIBRARY="$TIFF_LIBRARY" \
            2>&1 | tee cmake-configure.log

      - name: Upload Configure Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-configure-log
          path: cmake-configure.log
          if-no-files-found: ignore

      - name: Build Blender
        run: |
          cmake --build build_ios \
            --config Release \
            --parallel $(sysctl -n hw.ncpu)

      - name: Find Blender.app
        run: |
          echo "Searching for Blender.app..."

          find build_ios \
            -type d \
            -name "Blender.app" \
            -print

      - name: Package Unsigned IPA
        run: |
          APP="$(find build_ios -type d -name "Blender.app" -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app was not produced."
            exit 1
          fi

          echo "Found Blender.app:"
          echo "$APP"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/Blender.app

          /usr/bin/ditto \
            -c -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            Blender-iPad-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iPad-unsigned
          path: Blender-iPad-unsigned.ipa
