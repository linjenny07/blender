name: Build Blender iPad

on:
  workflow_dispatch:
  push:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout iOS branch
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        with:
          repository: linjenny07/blender
          ref: ios
          submodules: recursive
          lfs: false

      - name: Fetch Blender LFS data
        run: |
          git lfs install --local
          ./build_files/utils/make_update.py --no-libraries

      - name: Fetch iOS libraries
        run: |
          rm -rf lib/ios_arm64
          git clone https://projects.blender.org/blender/lib-ios_arm64.git lib/ios_arm64
          cd lib/ios_arm64
          git checkout 393201c7c8525941553f6a96e19b909d6b3bfc4f

      - name: Fetch macOS ARM64 libraries
        run: |
          rm -rf lib/macos_arm64
          git clone https://projects.blender.org/blender/lib-macos_arm64.git lib/macos_arm64
          cd lib/macos_arm64
          git checkout a241b11
          git lfs install
          git lfs pull

      - name: Inspect macOS Python
        run: |
          echo "========================================"
          echo "MACOS PYTHON DIAGNOSTIC"
          echo "========================================"

          echo ""
          echo "=== Python directory ==="
          ls -la lib/macos_arm64/python || true

          echo ""
          echo "=== Python bin ==="
          ls -la lib/macos_arm64/python/bin || true

          echo ""
          echo "=== Python include directories ==="
          find lib/macos_arm64/python -type d -name "include" -print || true

          echo ""
          echo "=== Python.h ==="
          find lib/macos_arm64/python -name "Python.h" -print || true

          echo ""
          echo "=== Python libraries ==="
          find lib/macos_arm64/python \
            \( -name "libpython*" -o -name "Python.framework" \) \
            -print || true

          echo ""
          echo "=== Python 3.13 files ==="
          find lib/macos_arm64/python -maxdepth 6 \
            \( -name "python3.13" \
            -o -name "Python.h" \
            -o -name "libpython3.13*" \) \
            -print || true

          echo ""
          echo "=== Python executable information ==="
          if [ -f "lib/macos_arm64/python/bin/python3.13" ]; then
            file lib/macos_arm64/python/bin/python3.13
            lib/macos_arm64/python/bin/python3.13 --version
          else
            echo "python3.13 executable NOT FOUND"
          fi

      - name: Install build tools
        run: |
          brew install cmake ninja

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          cmake --version
          ninja --version

      - name: Verify library layout
        run: |
          echo "=== lib directory ==="
          ls -la lib

          echo ""
          echo "=== iOS library directory ==="
          ls -la lib/ios_arm64 | head -100

          echo ""
          echo "=== macOS library directory ==="
          ls -la lib/macos_arm64 | head -100

      - name: Inspect OpenEXR
        run: |
          echo "=== OpenEXR directory ==="
          ls -la lib/ios_arm64/openexr

          echo ""
          echo "=== OpenEXR include ==="
          ls -la lib/ios_arm64/openexr/include/OpenEXR | head -30

          echo ""
          echo "=== OpenEXR libraries ==="
          find lib/ios_arm64/openexr/lib \
            -type f \
            -print \
            || true

          echo ""
          echo "=== OpenEXR CMake/package files ==="
          find lib/ios_arm64/openexr \
            -type f \
            \( \
              -name "*.cmake" \
              -o -name "*.cps" \
              -o -name "*Config*" \
              -o -name "*config*" \
            \) \
            -print \
            || true

      - name: Create OpenEXR CMake package
        run: |
          OPENEXR_ROOT="$PWD/lib/ios_arm64/openexr"
          OPENEXR_CMAKE_DIR="$OPENEXR_ROOT/lib/cmake/OpenEXR"

          echo "Creating OpenEXR CMake package:"
          echo "$OPENEXR_CMAKE_DIR"

          mkdir -p "$OPENEXR_CMAKE_DIR"

          cat > "$OPENEXR_CMAKE_DIR/OpenEXRConfig.cmake" <<EOF
          set(OpenEXR_FOUND TRUE)

          set(OpenEXR_INCLUDE_DIRS
              "${OPENEXR_ROOT}/include"
              "${OPENEXR_ROOT}/include/OpenEXR"
          )

          set(OpenEXR_LIBRARIES
              "${OPENEXR_ROOT}/lib/libOpenEXR.dylib"
              "${OPENEXR_ROOT}/lib/libOpenEXRCore.dylib"
              "${OPENEXR_ROOT}/lib/libOpenEXRUtil.dylib"
              "${OPENEXR_ROOT}/lib/libIex.dylib"
              "${OPENEXR_ROOT}/lib/libIlmThread.dylib"
          )

          if(NOT TARGET OpenEXR::OpenEXR)
            add_library(OpenEXR::OpenEXR UNKNOWN IMPORTED)
            set_target_properties(OpenEXR::OpenEXR PROPERTIES
              IMPORTED_LOCATION
                "${OPENEXR_ROOT}/lib/libOpenEXR.dylib"
              INTERFACE_INCLUDE_DIRECTORIES
                "${OPENEXR_ROOT}/include"
            )
          endif()

          if(NOT TARGET OpenEXR::OpenEXRCore)
            add_library(OpenEXR::OpenEXRCore UNKNOWN IMPORTED)
            set_target_properties(OpenEXR::OpenEXRCore PROPERTIES
              IMPORTED_LOCATION
                "${OPENEXR_ROOT}/lib/libOpenEXRCore.dylib"
              INTERFACE_INCLUDE_DIRECTORIES
                "${OPENEXR_ROOT}/include"
            )
          endif()

          if(NOT TARGET OpenEXR::OpenEXRUtil)
            add_library(OpenEXR::OpenEXRUtil UNKNOWN IMPORTED)
            set_target_properties(OpenEXR::OpenEXRUtil PROPERTIES
              IMPORTED_LOCATION
                "${OPENEXR_ROOT}/lib/libOpenEXRUtil.dylib"
              INTERFACE_INCLUDE_DIRECTORIES
                "${OPENEXR_ROOT}/include"
            )
          endif()

          if(NOT TARGET OpenEXR::Iex)
            add_library(OpenEXR::Iex UNKNOWN IMPORTED)
            set_target_properties(OpenEXR::Iex PROPERTIES
              IMPORTED_LOCATION
                "${OPENEXR_ROOT}/lib/libIex.dylib"
              INTERFACE_INCLUDE_DIRECTORIES
                "${OPENEXR_ROOT}/include"
            )
          endif()

          if(NOT TARGET OpenEXR::IlmThread)
            add_library(OpenEXR::IlmThread UNKNOWN IMPORTED)
            set_target_properties(OpenEXR::IlmThread PROPERTIES
              IMPORTED_LOCATION
                "${OPENEXR_ROOT}/lib/libIlmThread.dylib"
              INTERFACE_INCLUDE_DIRECTORIES
                "${OPENEXR_ROOT}/include"
            )
          endif()
          EOF

          cat > "$OPENEXR_CMAKE_DIR/OpenEXRConfigVersion.cmake" <<EOF
          set(PACKAGE_VERSION "3.3.0")
          set(PACKAGE_VERSION_COMPATIBLE TRUE)
          set(PACKAGE_VERSION_EXACT TRUE)
          EOF

          echo ""
          echo "=== Created OpenEXR CMake package ==="
          find "$OPENEXR_CMAKE_DIR" -type f -maxdepth 1 -print

          echo ""
          echo "=== OpenEXRConfig.cmake ==="
          cat "$OPENEXR_CMAKE_DIR/OpenEXRConfig.cmake"

      - name: Configure iOS build
        run: |
          PYTHON_ROOT="$PWD/lib/macos_arm64/python"

          PYTHON_EXECUTABLE="$PYTHON_ROOT/bin/python3.13"
          PYTHON_INCLUDE_DIR="$PYTHON_ROOT/include/python3.13"
          PYTHON_LIBRARY="$PYTHON_ROOT/lib/libpython3.13.a"
          PYTHON_INCLUDE_CONFIG_DIR="$PYTHON_ROOT/lib/python3.13/config-3.13-darwin"

          FREETYPE_ROOT="$PWD/lib/ios_arm64/freetype"
          FREETYPE_INCLUDE_DIR="$FREETYPE_ROOT/include/freetype2"
          FREETYPE_LIBRARY="$FREETYPE_ROOT/lib/libfreetype.a"

          OPENEXR_ROOT="$PWD/lib/ios_arm64/openexr"
          OPENEXR_DIR="$OPENEXR_ROOT/lib/cmake/OpenEXR"

          echo "=== Python configuration ==="
          echo "Executable: $PYTHON_EXECUTABLE"
          echo "Include:    $PYTHON_INCLUDE_DIR"
          echo "Library:    $PYTHON_LIBRARY"
          echo "Config:     $PYTHON_INCLUDE_CONFIG_DIR"

          echo ""
          echo "=== FreeType configuration ==="
          echo "Include:    $FREETYPE_INCLUDE_DIR"
          echo "Library:    $FREETYPE_LIBRARY"

          echo ""
          echo "=== OpenEXR configuration ==="
          echo "Root:       $OPENEXR_ROOT"
          echo "CMake dir:  $OPENEXR_DIR"

          test -f "$PYTHON_EXECUTABLE"
          test -f "$PYTHON_INCLUDE_DIR/Python.h"
          test -f "$PYTHON_LIBRARY"
          test -d "$PYTHON_INCLUDE_CONFIG_DIR"

          test -f "$FREETYPE_INCLUDE_DIR/ft2build.h"
          test -f "$FREETYPE_LIBRARY"

          test -f "$OPENEXR_DIR/OpenEXRConfig.cmake"

          "$PYTHON_EXECUTABLE" --version

          rm -rf build_ios

          cmake -S . -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$OPENEXR_DIR" \
            -DOpenEXR_DIR="$OPENEXR_DIR" \
            -DPYTHON_VERSION=3.13 \
            -DPYTHON_EXECUTABLE="$PYTHON_EXECUTABLE" \
            -DPYTHON_INCLUDE_DIR="$PYTHON_INCLUDE_DIR" \
            -DPYTHON_LIBRARY="$PYTHON_LIBRARY" \
            -DPYTHON_INCLUDE_CONFIG_DIR="$PYTHON_INCLUDE_CONFIG_DIR" \
            -DFREETYPE_INCLUDE_DIRS="$FREETYPE_INCLUDE_DIR" \
            -DFREETYPE_LIBRARY="$FREETYPE_LIBRARY"

      - name: Verify CMake configuration
        run: |
          echo "=== OpenEXR CMake cache ==="
          grep -i "OpenEXR" build_ios/CMakeCache.txt || true

          echo ""
          echo "=== OpenEXR package ==="
          find lib/ios_arm64/openexr/lib/cmake \
            -type f \
            -print \
            || true

      - name: Build Blender
        run: |
          cmake --build build_ios \
            --config Release \
            --parallel $(sysctl -n hw.ncpu)

      - name: Find Blender.app
        run: |
          echo "Searching for Blender.app..."

          find build_ios \
            -type d \
            -name "Blender.app" \
            -print

      - name: Package unsigned IPA
        run: |
          APP="$(find build_ios -type d -name "Blender.app" -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app was not produced."
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/Blender.app

          /usr/bin/ditto \
            -c -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            Blender-iPad-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iPad-unsigned
          path: Blender-iPad-unsigned.ipa
