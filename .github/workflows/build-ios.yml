name: Build Blender iOS IPA - Dependency Investigation

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Blender iOS Source
        uses: actions/checkout@v4
        with:
          ref: ios
          fetch-depth: 1
          lfs: false
          submodules: recursive

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf ~/Library/Android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles

          sudo xcrun simctl delete all 2>/dev/null || true

          df -h

      - name: Install Host Build Tools
        run: |
          brew install git-lfs cmake ninja

          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Initialize Git LFS
        run: |
          git lfs install

      - name: Show Source Revision
        run: |
          echo "========================================"
          echo "SOURCE REVISION"
          echo "========================================"

          git rev-parse HEAD
          git branch --show-current
          git status --short

      - name: Fetch Blender Dependencies
        run: |
          set -e

          echo "========================================"
          echo "FETCHING BLENDER DEPENDENCIES"
          echo "========================================"

          ./build_files/utils/make_update.py --use-ios-libraries

      - name: Inspect iOS Build Scripts
        run: |
          echo "========================================"
          echo "IOS BUILD SCRIPTS"
          echo "========================================"

          echo ""
          echo "Files in build_files/utils:"
          find build_files/utils \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "iOS-related scripts/files:"
          find build_files \
            -type f \
            \( \
              -iname "*ios*" \
              -o -iname "*fmt*" \
              -o -iname "*eigen*" \
            \) \
            -print \
            | sort \
            | head -300

      - name: Inspect iOS Library
        run: |
          echo "========================================"
          echo "IOS LIBRARY"
          echo "========================================"

          if [ ! -d "lib/ios_arm64" ]; then
            echo "ERROR: lib/ios_arm64 does not exist."
            exit 1
          fi

          echo ""
          echo "Top-level iOS libraries:"
          find lib/ios_arm64 \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -print \
            | sort

          echo ""
          echo "fmt:"
          if [ -d "lib/ios_arm64/fmt" ]; then
            find lib/ios_arm64/fmt \
              -maxdepth 5 \
              -type f \
              -print \
              | head -100
          else
            echo "fmt directory does not exist."
          fi

          echo ""
          echo "Eigen:"
          if [ -d "lib/ios_arm64/eigen" ]; then
            find lib/ios_arm64/eigen \
              -maxdepth 5 \
              -type f \
              -print \
              | head -100
          else
            echo "Eigen directory does not exist."
          fi

          echo ""
          echo "OpenEXR:"
          if [ -d "lib/ios_arm64/openexr" ]; then
            find lib/ios_arm64/openexr \
              -maxdepth 5 \
              -type f \
              -print \
              | head -150
          else
            echo "OpenEXR directory does not exist."
          fi

      - name: Inspect Dependency References
        run: |
          echo "========================================"
          echo "DEPENDENCY REFERENCES"
          echo "========================================"

          grep -Rni \
            --exclude-dir=.git \
            -E "ios_arm64|bootstrap_ios|fmt|eigen|OpenEXR" \
            build_files \
            CMakeLists.txt \
            2>/dev/null \
            | head -400 || true

      - name: Verify Host Python
        run: |
          echo "========================================"
          echo "HOST PYTHON"
          echo "========================================"

          if [ -x "lib/macos_arm64/python/bin/python3.13" ]; then
            echo "Found Blender host Python:"
            lib/macos_arm64/python/bin/python3.13 --version
          else
            echo "Host Python 3.13 was not found."
          fi

      - name: Show Apple Toolchain
        run: |
          echo "========================================"
          echo "APPLE TOOLCHAIN"
          echo "========================================"

          xcodebuild -version

          echo ""
          echo "Developer directory:"
          xcode-select -p

          echo ""
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path

          echo ""
          echo "CMake:"
          cmake --version

          echo ""
          echo "Ninja:"
          ninja --version

      - name: Generate Xcode Project
        run: |
          set -e

          echo "========================================"
          echo "GENERATING XCODE PROJECT"
          echo "========================================"

          rm -rf build_ios

          cmake \
            -G Xcode \
            -S . \
            -B build_ios

      - name: List Xcode Targets
        run: |
          set -e

          echo "========================================"
          echo "XCODE TARGETS"
          echo "========================================"

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -list

      - name: Build Cross Compilation Tools
        run: |
          set -e

          echo "========================================"
          echo "BUILDING CROSS COMPILATION TOOLS"
          echo "========================================"

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -target blender_cross_tools_compile \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee cross_tools_build.log

      - name: Build Blender iOS App
        run: |
          set -e

          echo "========================================"
          echo "BUILDING BLENDER FOR IOS"
          echo "========================================"

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            | tee ios_build.log

      - name: Locate Blender.app
        run: |
          echo "========================================"
          echo "SEARCHING FOR BLENDER.APP"
          echo "========================================"

          find build_ios \
            -type d \
            -name "Blender.app" \
            -print

      - name: Package Unsigned IPA
        run: |
          set -e

          APP="build_ios/bin/Release/Blender.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Blender.app was not produced."

            echo ""
            echo "Searching for any .app:"
            find build_ios \
              -type d \
              -name "*.app" \
              -print

            exit 1
          fi

          echo "Found Blender.app:"
          echo "$APP"

          echo ""
          echo "App size:"
          du -sh "$APP"

          rm -rf IPA
          mkdir -p IPA/Payload

          cp -R "$APP" IPA/Payload/Blender.app

          cd IPA

          /usr/bin/zip \
            -r \
            ../Blender-iPad-unsigned.ipa \
            Payload/

          cd ..

          echo ""
          echo "IPA:"
          ls -lh Blender-iPad-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: Blender-iPad-unsigned.ipa
          retention-days: 30

      - name: Upload Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blender-ios-build-diagnostics
          path: |
            cross_tools_build.log
            ios_build.log
            build_ios/**/*.log
            build_ios/**/*.txt
          retention-days: 7
