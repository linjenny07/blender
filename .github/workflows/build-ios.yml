name: Compile Latest Blender iPad App

on:
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout Blender Source
        uses: actions/checkout@v4
        with:
          repository: linjenny07/blender
          ref: ios
          submodules: recursive
          lfs: false

      - name: Install Build Tools
        run: |
          brew install cmake ninja
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Fetch Blender Libraries
        run: |
          git lfs install --local
          ./build_files/utils/make_update.py --no-libraries

      - name: Fetch iOS Libraries
        run: |
          rm -rf lib/ios_arm64

          git clone https://projects.blender.org/blender/lib-ios_arm64.git lib/ios_arm64

          cd lib/ios_arm64
          git checkout 393201c7c8525941553f6a96e19b909d6b3bfc4f

      - name: Fetch macOS ARM64 Libraries
        run: |
          rm -rf lib/macos_arm64

          git clone https://projects.blender.org/blender/lib-macos_arm64.git lib/macos_arm64

          cd lib/macos_arm64
          git checkout a241b11

          git lfs install
          git lfs pull

      - name: Inspect OpenEXR Libraries
        run: |
          set -e

          IOS_ROOT="$PWD/lib/ios_arm64"
          OPENEXR_ROOT="$IOS_ROOT/openexr"

          echo "========================================"
          echo "OPENEXR LIBRARY INSPECTION"
          echo "========================================"

          echo ""
          echo "=== OpenEXR directories ==="
          find "$OPENEXR_ROOT" \
            -maxdepth 5 \
            -type d \
            -print \
            | sort

          echo ""
          echo "=== OpenEXR libraries ==="
          find "$OPENEXR_ROOT" \
            -type f \
            \( \
              -name "*.a" \
              -o -name "*.dylib" \
              -o -name "*.tbd" \
            \) \
            -print \
            | sort

          echo ""
          echo "=== OpenEXR CMake files ==="
          find "$OPENEXR_ROOT" \
            -type f \
            \( \
              -name "*.cmake" \
              -o -name "*.cps" \
            \) \
            -print \
            | sort

          echo ""
          echo "=== OpenEXR headers ==="
          find "$OPENEXR_ROOT/include" \
            -type f \
            -name "*.h" \
            -print \
            | sort

          echo ""
          echo "=== Checking expected libraries ==="

          for lib in \
            libOpenEXR.a \
            libOpenEXRCore.a \
            libIlmImf.a \
            libIex.a \
            libIlmThread.a
          do
            FOUND="$(find "$OPENEXR_ROOT" \
              -type f \
              -name "$lib" \
              -print \
              -quit)"

            if [ -n "$FOUND" ]; then
              echo "FOUND: $FOUND"
            else
              echo "MISSING: $lib"
            fi
          done

          echo ""
          echo "========================================"
          echo "OPENEXR INSPECTION COMPLETE"
          echo "========================================"
          
      - name: Show Apple Toolchain
        run: |
          set -e

          echo "========================================"
          echo "APPLE TOOLCHAIN"
          echo "========================================"

          xcodebuild -version

          echo ""

          xcrun --sdk iphoneos --show-sdk-path

          echo ""

          xcrun --sdk iphoneos --show-sdk-version

          echo ""

          cmake --version

          echo ""

          ninja --version

      - name: Configure iOS Build
        run: |
          set -e

          IOS_ROOT="$PWD/lib/ios_arm64"
          MACOS_ROOT="$PWD/lib/macos_arm64"

          PYTHON_ROOT="$MACOS_ROOT/python"
          FREETYPE_ROOT="$IOS_ROOT/freetype"
          OPENEXR_ROOT="$IOS_ROOT/openexr"
          PNG_ROOT="$IOS_ROOT/png"
          JPEG_ROOT="$IOS_ROOT/jpeg"
          TIFF_ROOT="$IOS_ROOT/tiff"

          PYTHON_EXECUTABLE="$PYTHON_ROOT/bin/python3.13"
          PYTHON_INCLUDE_DIR="$PYTHON_ROOT/include/python3.13"
          PYTHON_LIBRARY="$PYTHON_ROOT/lib/libpython3.13.a"
          PYTHON_INCLUDE_CONFIG_DIR="$PYTHON_ROOT/lib/python3.13/config-3.13-darwin"

          FREETYPE_INCLUDE_DIR="$FREETYPE_ROOT/include/freetype2"
          FREETYPE_LIBRARY="$FREETYPE_ROOT/lib/libfreetype.a"

          PNG_INCLUDE_DIR="$PNG_ROOT/include"
          PNG_LIBRARY="$PNG_ROOT/lib/libpng16.a"

          JPEG_INCLUDE_DIR="$JPEG_ROOT/include"
          JPEG_LIBRARY="$JPEG_ROOT/lib/libjpeg.a"

          TIFF_INCLUDE_DIR="$TIFF_ROOT/include"
          TIFF_LIBRARY="$TIFF_ROOT/lib/libtiff.a"

          echo "========================================"
          echo "LOCATING OPENEXR"
          echo "========================================"

          OPENEXR_CONFIG="$(find "$OPENEXR_ROOT" \
            -type f \
            -name 'OpenEXRConfig.cmake' \
            -print \
            -quit 2>/dev/null || true)"

          if [ -z "$OPENEXR_CONFIG" ]; then
            echo "ERROR: OpenEXRConfig.cmake was not found."
            exit 1
          fi

          OPENEXR_DIR="$(dirname "$OPENEXR_CONFIG")"

          echo "OpenEXR root:"
          echo "$OPENEXR_ROOT"

          echo "OpenEXR config:"
          echo "$OPENEXR_CONFIG"

          echo "OpenEXR CMake directory:"
          echo "$OPENEXR_DIR"

          echo ""
          echo "========================================"
          echo "LOCATING FMT"
          echo "========================================"

          FMT_CONFIG="$(find "$IOS_ROOT/fmt" \
            -type f \
            \( \
              -name 'fmtConfig.cmake' \
              -o -name 'fmt-config.cmake' \
            \) \
            -print \
            -quit 2>/dev/null || true)"

          if [ -n "$FMT_CONFIG" ]; then
            FMT_DIR="$(dirname "$FMT_CONFIG")"

            echo "fmt config:"
            echo "$FMT_CONFIG"

            echo "fmt CMake directory:"
            echo "$FMT_DIR"
          else
            echo "fmt package config not found."
            FMT_DIR=""
          fi

          echo ""
          echo "========================================"
          echo "VERIFYING DEPENDENCIES"
          echo "========================================"

          test -x "$PYTHON_EXECUTABLE"
          test -f "$PYTHON_INCLUDE_DIR/Python.h"
          test -f "$PYTHON_LIBRARY"

          test -f "$FREETYPE_INCLUDE_DIR/ft2build.h"
          test -f "$FREETYPE_LIBRARY"

          test -f "$OPENEXR_CONFIG"

          test -f "$PNG_INCLUDE_DIR/png.h"
          test -f "$PNG_LIBRARY"

          test -f "$JPEG_INCLUDE_DIR/jpeglib.h"
          test -f "$JPEG_LIBRARY"

          test -f "$TIFF_INCLUDE_DIR/tiff.h"
          test -f "$TIFF_LIBRARY"

          echo ""
          echo "Python:"
          "$PYTHON_EXECUTABLE" --version

          echo ""
          echo "All required dependency files found."

          rm -rf build_ios

          echo ""
          echo "========================================"
          echo "RUNNING CMAKE"
          echo "========================================"

          CMAKE_PREFIXES="$IOS_ROOT;$OPENEXR_DIR"

          if [ -n "$FMT_DIR" ]; then
            CMAKE_PREFIXES="$CMAKE_PREFIXES;$FMT_DIR"
          fi

          cmake -S . -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIXES" \
            -DOpenEXR_DIR="$OPENEXR_DIR" \
            -DPYTHON_VERSION=3.13 \
            -DPYTHON_EXECUTABLE="$PYTHON_EXECUTABLE" \
            -DPYTHON_INCLUDE_DIR="$PYTHON_INCLUDE_DIR" \
            -DPYTHON_LIBRARY="$PYTHON_LIBRARY" \
            -DPYTHON_INCLUDE_CONFIG_DIR="$PYTHON_INCLUDE_CONFIG_DIR" \
            -DFREETYPE_INCLUDE_DIRS="$FREETYPE_INCLUDE_DIR" \
            -DFREETYPE_LIBRARY="$FREETYPE_LIBRARY" \
            -DPNG_PNG_INCLUDE_DIR="$PNG_INCLUDE_DIR" \
            -DPNG_LIBRARY="$PNG_LIBRARY" \
            -DJPEG_INCLUDE_DIR="$JPEG_INCLUDE_DIR" \
            -DJPEG_LIBRARY="$JPEG_LIBRARY" \
            -DTIFF_INCLUDE_DIR="$TIFF_INCLUDE_DIR" \
            -DTIFF_LIBRARY="$TIFF_LIBRARY"

      - name: Build Blender
        run: |
          set -e

          echo "========================================"
          echo "BUILDING BLENDER"
          echo "========================================"

          cmake --build build_ios \
            --config Release \
            --parallel "$(sysctl -n hw.ncpu)"

      - name: Find Blender App
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING FOR BLENDER.APP"
          echo "========================================"

          find build_ios \
            -type d \
            -name "Blender.app" \
            -print

      - name: Package Unsigned IPA
        run: |
          set -e

          APP="$(find build_ios \
            -type d \
            -name "Blender.app" \
            -print \
            -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app was not produced."
            exit 1
          fi

          echo "Found Blender.app:"
          echo "$APP"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/Blender.app

          /usr/bin/ditto \
            -c -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            Blender-iPad-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iPad-unsigned
          path: Blender-iPad-unsigned.ipa
