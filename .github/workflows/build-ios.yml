name: Build Blender iPad

on:
  workflow_dispatch:
  push:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout iOS branch
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        with:
          repository: linjenny07/blender
          ref: ios
          submodules: recursive
          lfs: false

      - name: Fetch Blender LFS data
        run: |
          git lfs install --local
          ./build_files/utils/make_update.py --no-libraries

      - name: Fetch iOS libraries
        run: |
          rm -rf lib/ios_arm64
          git clone https://projects.blender.org/blender/lib-ios_arm64.git lib/ios_arm64
          cd lib/ios_arm64
          git checkout 393201c7c8525941553f6a96e19b909d6b3bfc4f

      - name: Fetch macOS ARM64 libraries
        run: |
          rm -rf lib/macos_arm64
          git clone https://projects.blender.org/blender/lib-macos_arm64.git lib/macos_arm64
          cd lib/macos_arm64
          git checkout a241b11
          git lfs install
          git lfs pull

      - name: Install build tools
        run: |
          brew install cmake ninja

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          cmake --version
          ninja --version

      - name: Inspect PNG
        run: |
          echo "========================================"
          echo "PNG DIAGNOSTIC"
          echo "========================================"

          echo ""
          echo "=== PNG directory ==="
          ls -la lib/ios_arm64/png

          echo ""
          echo "=== PNG files ==="
          find lib/ios_arm64/png -type f -print | sort

      - name: Inspect OpenEXR
        run: |
          echo "========================================"
          echo "OPENEXR DIAGNOSTIC"
          echo "========================================"

          echo ""
          echo "=== OpenEXR directory ==="
          ls -la lib/ios_arm64/openexr

          echo ""
          echo "=== OpenEXR files ==="
          find lib/ios_arm64/openexr -type f -print | sort

          echo ""
          echo "=== OpenEXR libraries ==="
          find lib/ios_arm64/openexr/lib -type f -print | sort

          echo ""
          echo "=== OpenEXR package files ==="
          find lib/ios_arm64/openexr \
            \( -name "*.cmake" -o -name "*.cps" -o -name "*Config*" -o -name "*config*" \) \
            -print | sort

      - name: Create missing CMake package files
        run: |
          echo "Creating CMake package files for bundled iOS libraries..."

          mkdir -p lib/ios_arm64/openexr/lib/cmake/OpenEXR
          mkdir -p lib/ios_arm64/png/lib/cmake/PNG

          cat > lib/ios_arm64/openexr/lib/cmake/OpenEXR/OpenEXRConfig.cmake <<'EOF'
          set(OpenEXR_FOUND TRUE)

          set(OpenEXR_INCLUDE_DIR
              "${CMAKE_CURRENT_LIST_DIR}/../../../include")

          set(OpenEXR_INCLUDE_DIRS
              "${CMAKE_CURRENT_LIST_DIR}/../../../include"
              "${CMAKE_CURRENT_LIST_DIR}/../../../include/OpenEXR")

          set(OPENEXR_INCLUDE_DIR
              "${CMAKE_CURRENT_LIST_DIR}/../../../include")

          set(OPENEXR_INCLUDE_DIRS
              "${CMAKE_CURRENT_LIST_DIR}/../../../include"
              "${CMAKE_CURRENT_LIST_DIR}/../../../include/OpenEXR")

          set(OpenEXR_LIBRARIES
              "${CMAKE_CURRENT_LIST_DIR}/../../libOpenEXR.dylib"
              "${CMAKE_CURRENT_LIST_DIR}/../../libOpenEXRCore.dylib"
              "${CMAKE_CURRENT_LIST_DIR}/../../libOpenEXRUtil.dylib"
              "${CMAKE_CURRENT_LIST_DIR}/../../libIex.dylib"
              "${CMAKE_CURRENT_LIST_DIR}/../../libIlmThread.dylib")

          set(OPENEXR_LIBRARIES "${OpenEXR_LIBRARIES}")

          if(NOT TARGET OpenEXR::OpenEXR)
            add_library(OpenEXR::OpenEXR SHARED IMPORTED)
            set_target_properties(OpenEXR::OpenEXR PROPERTIES
              IMPORTED_LOCATION
                "${CMAKE_CURRENT_LIST_DIR}/../../libOpenEXR.dylib"
              INTERFACE_INCLUDE_DIRECTORIES
                "${CMAKE_CURRENT_LIST_DIR}/../../../include"
            )
          endif()

          if(NOT TARGET OpenEXR::OpenEXRCore)
            add_library(OpenEXR::OpenEXRCore SHARED IMPORTED)
            set_target_properties(OpenEXR::OpenEXRCore PROPERTIES
              IMPORTED_LOCATION
                "${CMAKE_CURRENT_LIST_DIR}/../../libOpenEXRCore.dylib"
              INTERFACE_INCLUDE_DIRECTORIES
                "${CMAKE_CURRENT_LIST_DIR}/../../../include"
            )
          endif()

          if(NOT TARGET OpenEXR::OpenEXRUtil)
            add_library(OpenEXR::OpenEXRUtil SHARED IMPORTED)
            set_target_properties(OpenEXR::OpenEXRUtil PROPERTIES
              IMPORTED_LOCATION
                "${CMAKE_CURRENT_LIST_DIR}/../../libOpenEXRUtil.dylib"
              INTERFACE_INCLUDE_DIRECTORIES
                "${CMAKE_CURRENT_LIST_DIR}/../../../include"
            )
          endif()

          if(NOT TARGET Iex::Iex)
            add_library(Iex::Iex SHARED IMPORTED)
            set_target_properties(Iex::Iex PROPERTIES
              IMPORTED_LOCATION
                "${CMAKE_CURRENT_LIST_DIR}/../../libIex.dylib"
              INTERFACE_INCLUDE_DIRECTORIES
                "${CMAKE_CURRENT_LIST_DIR}/../../../include"
            )
          endif()

          if(NOT TARGET IlmThread::IlmThread)
            add_library(IlmThread::IlmThread SHARED IMPORTED)
            set_target_properties(IlmThread::IlmThread PROPERTIES
              IMPORTED_LOCATION
                "${CMAKE_CURRENT_LIST_DIR}/../../libIlmThread.dylib"
              INTERFACE_INCLUDE_DIRECTORIES
                "${CMAKE_CURRENT_LIST_DIR}/../../../include"
            )
          endif()
          EOF

          cat > lib/ios_arm64/openexr/lib/cmake/OpenEXR/OpenEXRConfigVersion.cmake <<'EOF'
          set(PACKAGE_VERSION "3.0.0")
          set(PACKAGE_VERSION_COMPATIBLE TRUE)
          set(PACKAGE_VERSION_EXACT TRUE)
          EOF

          cat > lib/ios_arm64/png/lib/cmake/PNG/PNGConfig.cmake <<'EOF'
          set(PNG_FOUND TRUE)

          set(PNG_INCLUDE_DIR
              "${CMAKE_CURRENT_LIST_DIR}/../../../include")

          set(PNG_INCLUDE_DIRS
              "${CMAKE_CURRENT_LIST_DIR}/../../../include"
              "${CMAKE_CURRENT_LIST_DIR}/../../../include/libpng16")

          set(PNG_LIBRARY
              "${CMAKE_CURRENT_LIST_DIR}/../../libpng16.a")

          set(PNG_LIBRARIES "${PNG_LIBRARY}")

          if(NOT TARGET PNG::PNG)
            add_library(PNG::PNG STATIC IMPORTED)
            set_target_properties(PNG::PNG PROPERTIES
              IMPORTED_LOCATION
                "${CMAKE_CURRENT_LIST_DIR}/../../libpng16.a"
              INTERFACE_INCLUDE_DIRECTORIES
                "${CMAKE_CURRENT_LIST_DIR}/../../../include"
            )
          endif()
          EOF

          cat > lib/ios_arm64/png/lib/cmake/PNG/PNGConfigVersion.cmake <<'EOF'
          set(PACKAGE_VERSION "1.6.0")
          set(PACKAGE_VERSION_COMPATIBLE TRUE)
          set(PACKAGE_VERSION_EXACT TRUE)
          EOF

          echo ""
          echo "=== Created OpenEXR config ==="
          cat lib/ios_arm64/openexr/lib/cmake/OpenEXR/OpenEXRConfig.cmake

          echo ""
          echo "=== Created PNG config ==="
          cat lib/ios_arm64/png/lib/cmake/PNG/PNGConfig.cmake

      - name: Inspect macOS Python
        run: |
          echo "========================================"
          echo "MACOS PYTHON DIAGNOSTIC"
          echo "========================================"

          echo ""
          echo "=== Python directory ==="
          ls -la lib/macos_arm64/python || true

          echo ""
          echo "=== Python bin ==="
          ls -la lib/macos_arm64/python/bin || true

          echo ""
          echo "=== Python include directories ==="
          find lib/macos_arm64/python -type d -name "include" -print || true

          echo ""
          echo "=== Python.h ==="
          find lib/macos_arm64/python -name "Python.h" -print || true

          echo ""
          echo "=== Python libraries ==="
          find lib/macos_arm64/python \
            \( -name "libpython*" -o -name "Python.framework" \) \
            -print || true

          echo ""
          echo "=== Python 3.13 files ==="
          find lib/macos_arm64/python -maxdepth 6 \
            \( -name "python3.13" \
            -o -name "Python.h" \
            -o -name "libpython3.13*" \) \
            -print || true

          echo ""
          echo "=== Python executable information ==="
          if [ -f "lib/macos_arm64/python/bin/python3.13" ]; then
            file lib/macos_arm64/python/bin/python3.13
            lib/macos_arm64/python/bin/python3.13 --version
          else
            echo "python3.13 executable NOT FOUND"
          fi

      - name: Configure iOS build
        run: |
          PYTHON_ROOT="$PWD/lib/macos_arm64/python"

          PYTHON_EXECUTABLE="$PYTHON_ROOT/bin/python3.13"
          PYTHON_INCLUDE_DIR="$PYTHON_ROOT/include/python3.13"
          PYTHON_LIBRARY="$PYTHON_ROOT/lib/libpython3.13.a"
          PYTHON_INCLUDE_CONFIG_DIR="$PYTHON_ROOT/lib/python3.13/config-3.13-darwin"

          FREETYPE_ROOT="$PWD/lib/ios_arm64/freetype"
          FREETYPE_INCLUDE_DIR="$FREETYPE_ROOT/include/freetype2"
          FREETYPE_LIBRARY="$FREETYPE_ROOT/lib/libfreetype.a"

          PNG_ROOT="$PWD/lib/ios_arm64/png"
          PNG_INCLUDE_DIR="$PNG_ROOT/include"
          PNG_LIBRARY="$PNG_ROOT/lib/libpng16.a"

          OPENEXR_ROOT="$PWD/lib/ios_arm64/openexr"
          OPENEXR_INCLUDE_DIR="$OPENEXR_ROOT/include"
          OPENEXR_LIBRARY="$OPENEXR_ROOT/lib/libOpenEXR.dylib"

          echo "=== Python configuration ==="
          echo "Executable: $PYTHON_EXECUTABLE"
          echo "Include:    $PYTHON_INCLUDE_DIR"
          echo "Library:    $PYTHON_LIBRARY"
          echo "Config:     $PYTHON_INCLUDE_CONFIG_DIR"

          echo "=== FreeType configuration ==="
          echo "Include:    $FREETYPE_INCLUDE_DIR"
          echo "Library:    $FREETYPE_LIBRARY"

          echo "=== PNG configuration ==="
          echo "Include:    $PNG_INCLUDE_DIR"
          echo "Library:    $PNG_LIBRARY"

          echo "=== OpenEXR configuration ==="
          echo "Include:    $OPENEXR_INCLUDE_DIR"
          echo "Library:    $OPENEXR_LIBRARY"

          test -f "$PYTHON_EXECUTABLE"
          test -f "$PYTHON_INCLUDE_DIR/Python.h"
          test -f "$PYTHON_LIBRARY"
          test -d "$PYTHON_INCLUDE_CONFIG_DIR"

          test -f "$FREETYPE_INCLUDE_DIR/ft2build.h"
          test -f "$FREETYPE_LIBRARY"

          test -f "$PNG_ROOT/include/png.h"
          test -f "$PNG_LIBRARY"

          test -f "$OPENEXR_ROOT/include/OpenEXR/ImfHeader.h"
          test -f "$OPENEXR_ROOT/lib/libOpenEXR.dylib"
          test -f "$OPENEXR_ROOT/lib/libOpenEXRCore.dylib"
          test -f "$OPENEXR_ROOT/lib/libOpenEXRUtil.dylib"
          test -f "$OPENEXR_ROOT/lib/libIex.dylib"
          test -f "$OPENEXR_ROOT/lib/libIlmThread.dylib"

          "$PYTHON_EXECUTABLE" --version

          rm -rf build_ios

          cmake -S . -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$OPENEXR_ROOT;$PNG_ROOT" \
            -DOpenEXR_DIR="$OPENEXR_ROOT/lib/cmake/OpenEXR" \
            -DPNG_DIR="$PNG_ROOT/lib/cmake/PNG" \
            -DOpenEXR_ROOT="$OPENEXR_ROOT" \
            -DPNG_ROOT="$PNG_ROOT" \
            -DOpenEXR_INCLUDE_DIR="$OPENEXR_INCLUDE_DIR" \
            -DOPENEXR_INCLUDE_DIR="$OPENEXR_INCLUDE_DIR" \
            -DOPENEXR_INCLUDE_DIRS="$OPENEXR_INCLUDE_DIR" \
            -DOPENEXR_LIBRARIES="$OPENEXR_ROOT/lib/libOpenEXR.dylib;$OPENEXR_ROOT/lib/libOpenEXRCore.dylib;$OPENEXR_ROOT/lib/libOpenEXRUtil.dylib;$OPENEXR_ROOT/lib/libIex.dylib;$OPENEXR_ROOT/lib/libIlmThread.dylib" \
            -DPNG_INCLUDE_DIR="$PNG_INCLUDE_DIR" \
            -DPNG_PNG_INCLUDE_DIR="$PNG_INCLUDE_DIR" \
            -DPNG_LIBRARY="$PNG_LIBRARY" \
            -DPNG_LIBRARIES="$PNG_LIBRARY" \
            -DPYTHON_VERSION=3.13 \
            -DPYTHON_EXECUTABLE="$PYTHON_EXECUTABLE" \
            -DPYTHON_INCLUDE_DIR="$PYTHON_INCLUDE_DIR" \
            -DPYTHON_LIBRARY="$PYTHON_LIBRARY" \
            -DPYTHON_INCLUDE_CONFIG_DIR="$PYTHON_INCLUDE_CONFIG_DIR" \
            -DFREETYPE_INCLUDE_DIRS="$FREETYPE_INCLUDE_DIR" \
            -DFREETYPE_LIBRARY="$FREETYPE_LIBRARY"

      - name: Show CMake OpenEXR and PNG results
        run: |
          echo "=== OpenEXR CMake result ==="
          grep -i "openexr" build_ios/CMakeCache.txt | head -50 || true

          echo ""
          echo "=== PNG CMake result ==="
          grep -i "png" build_ios/CMakeCache.txt | head -50 || true

      - name: Build Blender
        run: |
          cmake --build build_ios \
            --config Release \
            --parallel $(sysctl -n hw.ncpu)

      - name: Find Blender.app
        run: |
          echo "Searching for Blender.app..."
          find build_ios -type d -name "Blender.app" -print

      - name: Package unsigned IPA
        run: |
          APP="$(find build_ios -type d -name "Blender.app" -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app was not produced."
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/Blender.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            Payload Blender-iPad-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iPad-unsigned
          path: Blender-iPad-unsigned.ipa
