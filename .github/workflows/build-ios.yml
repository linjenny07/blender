name: Build Blender iOS IPA

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Blender iOS Source
        uses: actions/checkout@v4
        with:
          ref: ios
          fetch-depth: 1
          lfs: false
          submodules: recursive

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf ~/Library/Android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles

          sudo xcrun simctl delete all 2>/dev/null || true

          df -h

      - name: Install Host Build Tools
        run: |
          brew install git-lfs cmake ninja

          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Initialize Git LFS
        run: |
          git lfs install

      - name: Fetch Blender Dependencies
        run: |
          set -e

          ./build_files/utils/make_update.py --use-ios-libraries

      - name: Bootstrap Missing iOS Dependencies
        run: |
          set -e

          echo "========================================"
          echo "BOOTSTRAPPING iOS DEPENDENCIES"
          echo "========================================"

          if [ ! -f lib/ios_arm64/fmt/include/fmt/core.h ]; then
            echo "fmt is missing - bootstrapping..."
            bash ./build_files/utils/bootstrap_ios_fmt.sh
          else
            echo "fmt already present."
          fi

          if [ ! -f lib/ios_arm64/eigen/share/eigen3/cmake/Eigen3Config.cmake ]; then
            echo "Eigen is missing - bootstrapping..."
            bash ./build_files/utils/bootstrap_ios_eigen.sh
          else
            echo "Eigen already present."
          fi

      - name: Verify iOS Dependencies
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING iOS DEPENDENCIES"
          echo "========================================"

          echo ""
          echo "=== iOS Library Root ==="
          ls -la lib/ios_arm64

          echo ""
          echo "=== fmt ==="

          if [ -f lib/ios_arm64/fmt/include/fmt/core.h ]; then
            echo "OK: fmt"
          else
            echo "ERROR: fmt is missing."
            exit 1
          fi

          echo ""
          echo "=== Eigen ==="

          if [ -f lib/ios_arm64/eigen/share/eigen3/cmake/Eigen3Config.cmake ]; then
            echo "OK: Eigen"
          else
            echo "ERROR: Eigen is missing."
            exit 1
          fi

          echo ""
          echo "=== OpenEXR ==="

          if [ -d lib/ios_arm64/openexr ]; then
            echo "OK: OpenEXR directory exists."
          else
            echo "ERROR: OpenEXR directory is missing."
            exit 1
          fi

          echo ""
          echo "=== Python ==="

          if [ -x lib/macos_arm64/python/bin/python3.13 ]; then
            echo "OK: Host Python"
            lib/macos_arm64/python/bin/python3.13 --version
          else
            echo "ERROR: Host Python is missing."
            exit 1
          fi

          echo ""
          echo "Dependency verification complete."

      - name: Show Apple Toolchain
        run: |
          echo "========================================"
          echo "APPLE TOOLCHAIN"
          echo "========================================"

          xcodebuild -version

          echo ""
          echo "Developer directory:"
          xcode-select -p

          echo ""
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path

          echo ""
          echo "CMake:"
          cmake --version

          echo ""
          echo "Ninja:"
          ninja --version

      - name: Generate Xcode Project
        run: |
          set -e

          rm -rf build_ios

          echo "========================================"
          echo "GENERATING XCODE PROJECT"
          echo "========================================"

          cmake -G Xcode -S . -B build_ios

      - name: List Xcode Targets
        run: |
          set -e

          echo "========================================"
          echo "XCODE TARGETS"
          echo "========================================"

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -list

      - name: Build Cross Compilation Tools
        run: |
          set -e

          echo "========================================"
          echo "BUILDING CROSS COMPILATION TOOLS"
          echo "========================================"

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -target blender_cross_tools_compile \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee cross_tools_build.log

      - name: Build Blender iOS App
        run: |
          set -e

          echo "========================================"
          echo "BUILDING BLENDER FOR iOS"
          echo "========================================"

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            | tee ios_build.log

      - name: Locate Blender.app
        run: |
          echo "========================================"
          echo "SEARCHING FOR BLENDER.APP"
          echo "========================================"

          find build_ios \
            -type d \
            -name "Blender.app" \
            -print

      - name: Package Unsigned IPA
        run: |
          set -e

          echo "========================================"
          echo "PACKAGING IPA"
          echo "========================================"

          APP="build_ios/bin/Release/Blender.app"

          if [ ! -d "$APP" ]; then
            echo "Expected Blender.app was not found."
            echo "Searching build directory..."

            find build_ios \
              -type d \
              -name "*.app" \
              -print

            exit 1
          fi

          echo "Found Blender.app:"
          echo "$APP"

          echo ""
          echo "App size:"
          du -sh "$APP"

          rm -rf IPA
          mkdir -p IPA/Payload

          cp -R "$APP" IPA/Payload/Blender.app

          cd IPA

          /usr/bin/zip \
            -r \
            ../Blender-iPad-unsigned.ipa \
            Payload/

          cd ..

          echo ""
          echo "IPA created:"
          ls -lh Blender-iPad-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: Blender-iPad-unsigned.ipa
          retention-days: 30

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blender-ios-build-logs
          path: |
            cross_tools_build.log
            ios_build.log
            build_ios/**/*.log
            build_ios/**/*.txt
          retention-days: 7
