name: Build Blender iPad

on:
  workflow_dispatch:
  push:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout iOS branch
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        with:
          repository: linjenny07/blender
          ref: ios
          submodules: recursive
          lfs: false

      - name: Fetch Blender LFS data
        run: |
          git lfs install --local
          ./build_files/utils/make_update.py --no-libraries

      - name: Fetch iOS libraries
        run: |
          rm -rf lib/ios_arm64
          git clone https://projects.blender.org/blender/lib-ios_arm64.git lib/ios_arm64
          cd lib/ios_arm64
          git checkout 393201c7c8525941553f6a96e19b909d6b3bfc4f

      - name: Fetch macOS ARM64 libraries
        run: |
          rm -rf lib/macos_arm64
          git clone https://projects.blender.org/blender/lib-macos_arm64.git lib/macos_arm64
          cd lib/macos_arm64
          git checkout a241b11
          git lfs install
          git lfs pull

      - name: Install build tools
        run: |
          brew install cmake ninja

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          cmake --version
          ninja --version

      - name: Inspect Python
        run: |
          PYTHON_ROOT="$PWD/lib/macos_arm64/python"

          echo "=== Python directory ==="
          ls -la "$PYTHON_ROOT" || true

          echo "=== Python executable ==="
          ls -la "$PYTHON_ROOT/bin" || true

          echo "=== Python headers ==="
          find "$PYTHON_ROOT" -name "Python.h" -print || true

          echo "=== Python libraries ==="
          find "$PYTHON_ROOT" \
            \( -name "libpython*" -o -name "Python.framework" \) \
            -print || true

          if [ -f "$PYTHON_ROOT/bin/python3.13" ]; then
            file "$PYTHON_ROOT/bin/python3.13"
            "$PYTHON_ROOT/bin/python3.13" --version
          else
            echo "python3.13 executable NOT FOUND"
          fi

      - name: Inspect PNG
        run: |
          PNG_ROOT="$PWD/lib/ios_arm64/png"

          echo "========================================"
          echo "PNG DIAGNOSTIC"
          echo "========================================"

          echo ""
          echo "=== PNG directory ==="
          ls -la "$PNG_ROOT"

          echo ""
          echo "=== PNG files ==="
          find "$PNG_ROOT" -type f -print

          echo ""
          echo "=== PNG headers ==="
          test -f "$PNG_ROOT/include/png.h"
          test -f "$PNG_ROOT/include/libpng16/png.h"

          echo ""
          echo "=== PNG libraries ==="
          test -f "$PNG_ROOT/lib/libpng.a"
          test -f "$PNG_ROOT/lib/libpng16.a"

          echo "PNG files verified successfully."

      - name: Inspect FreeType
        run: |
          FREETYPE_ROOT="$PWD/lib/ios_arm64/freetype"

          echo "=== FreeType ==="
          ls -la "$FREETYPE_ROOT"

          test -f "$FREETYPE_ROOT/include/freetype2/ft2build.h"
          test -f "$FREETYPE_ROOT/lib/libfreetype.a"

      - name: Inspect OpenEXR
        run: |
          OPENEXR_ROOT="$PWD/lib/ios_arm64/openexr"

          echo "========================================"
          echo "OPENEXR DIAGNOSTIC"
          echo "========================================"

          echo ""
          echo "=== OpenEXR directory ==="
          ls -la "$OPENEXR_ROOT"

          echo ""
          echo "=== OpenEXR files ==="
          find "$OPENEXR_ROOT" -maxdepth 6 -type f -print | sort

          echo ""
          echo "=== OpenEXR CMake/package files ==="
          find "$OPENEXR_ROOT" -type f \
            \( \
              -name "OpenEXRConfig.cmake" \
              -o -name "openexr-config.cmake" \
              -o -name "OpenEXRConfigVersion.cmake" \
              -o -name "*.cmake" \
              -o -name "*.cps" \
            \) \
            -print

          echo ""
          echo "=== OpenEXR libraries ==="
          find "$OPENEXR_ROOT/lib" -type f \
            \( \
              -name "*.a" \
              -o -name "*.dylib" \
            \) \
            -print

      - name: Configure iOS build
        run: |
          PYTHON_ROOT="$PWD/lib/macos_arm64/python"

          PYTHON_EXECUTABLE="$PYTHON_ROOT/bin/python3.13"
          PYTHON_INCLUDE_DIR="$PYTHON_ROOT/include/python3.13"
          PYTHON_LIBRARY="$PYTHON_ROOT/lib/libpython3.13.a"
          PYTHON_INCLUDE_CONFIG_DIR="$PYTHON_ROOT/lib/python3.13/config-3.13-darwin"

          FREETYPE_ROOT="$PWD/lib/ios_arm64/freetype"
          FREETYPE_INCLUDE_DIR="$FREETYPE_ROOT/include/freetype2"
          FREETYPE_LIBRARY="$FREETYPE_ROOT/lib/libfreetype.a"

          PNG_ROOT="$PWD/lib/ios_arm64/png"
          PNG_INCLUDE_DIR="$PNG_ROOT/include"
          PNG_LIBRARY="$PNG_ROOT/lib/libpng.a"

          OPENEXR_ROOT="$PWD/lib/ios_arm64/openexr"

          echo "========================================"
          echo "CONFIGURATION"
          echo "========================================"

          echo "Python executable: $PYTHON_EXECUTABLE"
          echo "Python include:    $PYTHON_INCLUDE_DIR"
          echo "Python library:    $PYTHON_LIBRARY"

          echo ""
          echo "FreeType include:  $FREETYPE_INCLUDE_DIR"
          echo "FreeType library:  $FREETYPE_LIBRARY"

          echo ""
          echo "PNG root:          $PNG_ROOT"
          echo "PNG include:       $PNG_INCLUDE_DIR"
          echo "PNG library:       $PNG_LIBRARY"

          echo ""
          echo "OpenEXR root:      $OPENEXR_ROOT"

          echo ""
          echo "=== Verify files ==="

          test -f "$PYTHON_EXECUTABLE"
          test -f "$PYTHON_INCLUDE_DIR/Python.h"
          test -f "$PYTHON_LIBRARY"
          test -d "$PYTHON_INCLUDE_CONFIG_DIR"

          test -f "$FREETYPE_INCLUDE_DIR/ft2build.h"
          test -f "$FREETYPE_LIBRARY"

          test -f "$PNG_INCLUDE_DIR/png.h"
          test -f "$PNG_LIBRARY"

          "$PYTHON_EXECUTABLE" --version

          echo ""
          echo "All explicitly configured dependencies verified."

          rm -rf build_ios

          cmake -S . -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPYTHON_VERSION=3.13 \
            -DPYTHON_EXECUTABLE="$PYTHON_EXECUTABLE" \
            -DPYTHON_INCLUDE_DIR="$PYTHON_INCLUDE_DIR" \
            -DPYTHON_LIBRARY="$PYTHON_LIBRARY" \
            -DPYTHON_INCLUDE_CONFIG_DIR="$PYTHON_INCLUDE_CONFIG_DIR" \
            -DFREETYPE_INCLUDE_DIRS="$FREETYPE_INCLUDE_DIR" \
            -DFREETYPE_LIBRARY="$FREETYPE_LIBRARY" \
            -DPNG_PNG_INCLUDE_DIR="$PNG_INCLUDE_DIR" \
            -DPNG_LIBRARY="$PNG_LIBRARY" \
            -DPNG_INCLUDE_DIR="$PNG_INCLUDE_DIR" \
            -DCMAKE_PREFIX_PATH="$PNG_ROOT;$OPENEXR_ROOT"

      - name: Debug CMake configuration
        run: |
          echo "=== PNG cache ==="
          grep -i "PNG" build_ios/CMakeCache.txt || true

          echo ""
          echo "=== OpenEXR cache ==="
          grep -i "OPENEXR" build_ios/CMakeCache.txt || true

          echo ""
          echo "=== Python cache ==="
          grep -i "PYTHON" build_ios/CMakeCache.txt | head -50 || true

      - name: Build Blender
        run: |
          cmake --build build_ios \
            --config Release \
            --parallel $(sysctl -n hw.ncpu)

      - name: Find Blender.app
        run: |
          echo "Searching for Blender.app..."
          find build_ios -type d -name "Blender.app" -print

      - name: Package unsigned IPA
        run: |
          APP="$(find build_ios -type d -name "Blender.app" -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app was not produced."
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/Blender.app

          /usr/bin/ditto \
            -c -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            Blender-iPad-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iPad-unsigned
          path: Blender-iPad-unsigned.ipa
